name: OSM scenes

# สร้างฉากรอบสนามจาก OpenStreetMap (public/osm/*) — รันเมื่อแก้รายชื่อสนามใน scripts/osm-circuits.txt
# ดึงครั้งเดียวต่อสนามแล้วเก็บเป็นไฟล์ในรีโป (ผู้ชมเว็บไม่ได้ยิง Overpass เอง)
on:
  push:
    paths: [scripts/osm-circuits.txt]
  workflow_dispatch:

concurrency:
  group: osm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: ดึงข้อมูล OSM แล้ววาดฉาก
        run: node scripts/osm-scene.mjs $(grep -v '^#' scripts/osm-circuits.txt)

      - name: เก็บผลลัพธ์เข้า branch เดิม
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/osm lib/osm-scenes.gen.ts
          if git diff --cached --quiet; then echo "ไม่มีอะไรเปลี่ยน"; exit 0; fi
          git commit -m "OSM scenes: $(grep -v '^#' scripts/osm-circuits.txt | tr '\n' ' ')"
          git push
