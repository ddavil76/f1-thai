name: Android

# สร้าง APK ของ widget Android — เครื่องของ GitHub มี Android SDK อยู่แล้ว
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# สร้าง/แทน release ทดลอง (android-preview) ให้โหลด APK ตรงจากมือถือได้
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
        name: Unit tests + build APK

      - run: cp app/build/outputs/apk/debug/app-debug.apk f1-week-race.apk

      - uses: actions/upload-artifact@v4
        with:
          name: f1-week-race-apk
          path: android/f1-week-race.apk
          if-no-files-found: error

      # ลิงก์ถาวร: https://github.com/<owner>/<repo>/releases/download/android-preview/f1-week-race.apk
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-preview --yes --cleanup-tag || true
          gh release create android-preview f1-week-race.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android widget (ทดลอง)" \
            --notes "APK ทดลองของ widget Android — สร้างจาก ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
