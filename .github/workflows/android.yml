name: Android

# สร้าง APK ของ widget Android — เครื่องของ GitHub มี Android SDK อยู่แล้ว
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# สร้าง/แทน release ที่มี APK ให้โหลดตรงจากมือถือได้
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
        name: Unit tests + build APK

      - run: cp app/build/outputs/apk/debug/app-debug.apk f1-week-race.apk

      - uses: actions/upload-artifact@v4
        with:
          name: f1-week-race-apk
          path: android/f1-week-race.apk
          if-no-files-found: error

      # main → release "android" (หน้า /widget ลิงก์มาที่นี่) · branch อื่น → "android-preview" ไว้ลองก่อน
      # ลิงก์ถาวร: https://github.com/<owner>/<repo>/releases/download/<tag>/f1-week-race.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAG=android; TITLE="Android widget"; FLAGS="--latest"
          else
            TAG=android-preview; TITLE="Android widget (ทดลอง)"; FLAGS="--prerelease"
          fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" f1-week-race.apk $FLAGS \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "APK ของ widget Android — สร้างจาก ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
